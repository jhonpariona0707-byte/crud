<section>
  <div class="page-heading">
    <h1>Detalle del alumno</h1>
    <a class="button secondary" routerLink="/alumnos">Volver a alumnos</a>
  </div>

  @if (errorMessage) {
    <p class="notice" role="alert">{{ errorMessage }}</p>
  }
  @if (loading) {
    <div class="card"><p>Cargando alumno…</p></div>
  } @else if (alumno) {
    <article class="card">
      <h2>{{ alumno.nombre }} {{ alumno.apellido }}</h2>
      <dl class="detail-list">
        <dt>Edad</dt><dd>{{ alumno.edad ?? '—' }}</dd>
        <dt>Correo</dt><dd>{{ alumno.correo }}</dd>
      </dl>
      <div class="actions">
        <a class="button" [routerLink]="['/alumnos', alumno.id, 'editar']">Editar datos</a>
        <a class="button secondary" routerLink="/alumnos">Volver</a>
      </div>
    </article>
  }
</section>
